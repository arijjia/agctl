name: dsh-bump

# Еженедельный cron снят: его гейт e2e-smoke.sh проверяет v2-workspaces,
# удалённые в v3 (POST /api/workspaces → 410), поэтому расписание давало
# гарантированно красный запуск каждый понедельник. Вернуть cron после
# v3-сценария e2e (персональный контейнер + проекты). Ручной запуск:
#   gh workflow run dsh-bump --repo arijjia/agctl
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Обновить pin DSH до latest rc/stable
        run: bin/dsh-bump.sh --update
      - id: diff
        name: Проверить, изменился ли pin
        run: |
          if git diff --quiet -- internal/assets/image/Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        name: Go и SPA тесты
        run: |
          go vet ./...
          go test ./...
          make web_build
      - if: steps.diff.outputs.changed == 'true'
        name: Собрать новый образ DSH
        run: make img_build IMG=agctl-dsh:dsh-bump-e2e
      - if: steps.diff.outputs.changed == 'true'
        name: Изолированный e2e со стабом LLM
        env:
          TEST_IMAGE: agctl-dsh:dsh-bump-e2e
          FAKE_LLM: "1"
          FAKE_LLM_BIND: 0.0.0.0
          CLEANUP: "1"
        run: bin/e2e-smoke.sh
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: bot/dsh-upgrade
          delete-branch: true
          title: "chore(image): update pinned DSH version"
          commit-message: "chore(image): update pinned DSH version"
          body: |
            Automated DSH pin refresh from npm `latest` (rc/stable only).
            Go tests, SPA build, Docker image build, and isolated e2e must pass
            before this PR is created.
