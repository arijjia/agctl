# Локальный смоук в kind (bin/e2e-k8s-kind.sh): образы загружены в узел
# (kind load), pull-политика Never, NodePort наружу, RWX не нужен (standard
# StorageClass kind даёт RWO; PVC на пользователя).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # base уже переименовал образ в registry.example.com/… — матчить нужно
  # итоговое имя base-трансформа, иначе overlay молча не применяется и узел
  # получает недоступный registry (ErrImageNeverPull).
  - name: registry.example.com/agctl/agctl-serve
    newName: agctl-serve
    newTag: dev
patches:
  - path: patch-deployment.yaml
  - path: patch-service.yaml
  - target:
      kind: PersistentVolumeClaim
      name: agctl-data
    patch: |
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: agctl-data
