name: ci

on:
  push:
    branches: [main]
    # Тег v* — релиз: тесты, затем goreleaser (job release-snapshot).
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: build SPA
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка образа agctl-dsh в CI не гоняем: npm-установка dsh внутри требует
  # сеть и время; локально — `make img_build`. Публичные релизы бинаря —
  # goreleaser по тегу (см. .goreleaser.yaml).
  release-snapshot:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, web]
    # goreleaser создаёт релиз и загружает архивы — токену нужна запись.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      # Заметки к релизу — docs/releases/<тег>.md, обязательно: без них
      # goreleaser собрал бы список из всей истории коммитов.
      - name: заметки к релизу
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$f" ]; then echo "::error::нет $f — заметки к релизу пишутся руками"; exit 1; fi
          echo "args=--release-notes $f" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
