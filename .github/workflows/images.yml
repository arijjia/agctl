# images — образы рабочего места в GitHub Container Registry
# (ghcr.io/<владелец>/agctl-dsh и agctl-dsh-min, linux/amd64 + linux/arm64):
# установка без сборки на месте — лаунчер скачивает образ, а если реестр
# недоступен, собирает его локально под тем же именем.
#
# Запуск: вручную (Actions → images → Run workflow; версия dsh — пусто = пин
# из Dockerfile, тег образа — пусто = 0.2.2 для пина, иначе версия dsh) или
# тегом v* вместе с релизом бинарей. Новый пакет GHCR по умолчанию приватный:
# после первой публикации откройте его в настройках пакета (Change visibility
# → Public), иначе docker pull без входа не сработает.
name: images

on:
  workflow_dispatch:
    inputs:
      dsh:
        description: "версия dsh (пусто — пин из Dockerfile)"
        required: false
        default: ""
      tag:
        description: "тег образа (пусто — 0.2.2 для пина, иначе версия dsh)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: версии и имена
        id: v
        env:
          IN_DSH: ${{ inputs.dsh }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          pin="$(sed -n 's/^ARG DSH_VERSION=\([0-9][^" ]*\).*/\1/p' internal/assets/image/Dockerfile | head -1)"
          dsh="${IN_DSH:-$pin}"
          tag="$IN_TAG"
          if [ -z "$tag" ]; then if [ "$dsh" = "$pin" ]; then tag=0.2.2; else tag="$dsh"; fi; fi
          version="${GITHUB_REF_NAME#v}"; case "$GITHUB_REF" in refs/tags/v*) ;; *) version=0.1.0 ;; esac
          {
            echo "dsh=$dsh"; echo "tag=$tag"; echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"; echo "date=$(date -u +%F)"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - name: guest agctl и контекст сборки (как make img_build)
        env:
          V: ${{ steps.v.outputs.version }}
          C: ${{ steps.v.outputs.commit }}
          D: ${{ steps.v.outputs.date }}
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$V -X main.commit=$C -X main.buildDate=$D" \
            -o guest ./cmd/agctl-guest
          rm -rf ctx && mkdir -p ctx/skel
          cp -R internal/assets/image/. ctx/
          cp -R internal/assets/dsh-skel/. ctx/skel/
          cp guest ctx/agctl
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: сборка и публикация (${{ matrix.arch }})
        env:
          REG: ${{ steps.v.outputs.registry }}
          TAG: ${{ steps.v.outputs.tag }}
          DSH: ${{ steps.v.outputs.dsh }}
          V: ${{ steps.v.outputs.version }}
          C: ${{ steps.v.outputs.commit }}
          D: ${{ steps.v.outputs.date }}
        run: |
          args="--build-arg DSH_VERSION=$DSH --build-arg AGCTL_VERSION=$V --build-arg AGCTL_COMMIT=$C --build-arg AGCTL_BUILD_DATE=$D"
          docker build $args -t "$REG/agctl-dsh:$TAG-${{ matrix.arch }}" ctx
          docker build $args -f ctx/Dockerfile.min -t "$REG/agctl-dsh-min:$TAG-${{ matrix.arch }}" ctx
          docker push "$REG/agctl-dsh:$TAG-${{ matrix.arch }}"
          docker push "$REG/agctl-dsh-min:$TAG-${{ matrix.arch }}"
          docker image inspect "$REG/agctl-dsh:$TAG-${{ matrix.arch }}" --format '{{json .Config.Labels}}'

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: мультиархитектурные теги
        env:
          REG: ${{ needs.build.outputs.registry }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          for img in agctl-dsh agctl-dsh-min; do
            docker buildx imagetools create -t "$REG/$img:$TAG" "$REG/$img:$TAG-amd64" "$REG/$img:$TAG-arm64"
            docker buildx imagetools inspect "$REG/$img:$TAG"
          done
