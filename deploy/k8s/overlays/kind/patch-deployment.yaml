apiVersion: apps/v1
kind: Deployment
metadata:
  name: agctl
spec:
  template:
    spec:
      containers:
        - name: agctl
          imagePullPolicy: Never
          env:
            - name: AGCTL_PROFILE_DIR
              value: "" # без ConfigMap профиля (make k8s_profile) — встроенный нейтральный agctl
            - name: AGCTL_K8S_IMAGE
              value: agctl-dsh:0.2.2
            - name: AGCTL_K8S_PULL_POLICY
              value: Never
            - name: AGCTL_K8S_SHARED_CLAIM
              value: ""
            - name: AGCTL_K8S_LIVENESS
              value: "0"
          volumeMounts:
            - name: home
              mountPath: /var/lib/agctl
            - name: tmp
              mountPath: /tmp
            - name: data
              $patch: delete
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: agctl-home
        - name: profile
          configMap:
            name: agctl-profile
            optional: true
        - name: profile-assets
          configMap:
            name: agctl-profile-assets
            optional: true
        - name: tmp
          emptyDir: {}
        - name: data
          $patch: delete
