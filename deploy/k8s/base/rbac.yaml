apiVersion: v1
kind: ServiceAccount
metadata:
  name: agctl
---
# Права шлюза ровно на то, что создаёт k8srt: поды пользователей (+ логи и
# exec для boot-токена/проверки SSH), сервисы, PVC, Secret ключей, политики.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agctl-runtime
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agctl-runtime
subjects:
  - kind: ServiceAccount
    name: agctl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agctl-runtime
