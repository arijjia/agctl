# ─────────────────────────────────────────────────────────────────────────────
# profile.yaml — профиль организации для agctl (пример-шаблон).
#
# Что это:   единственный файл настроек организации. Вместе с соседними
#            каталогами (assets/, catalog/, image/, local/) он и есть профиль.
# Кто читает: agctl (локальный режим разработчика) и agctl-server (сервер
#            организации) — при старте. Правка вступает в силу после
#            перезапуска (`agctl dev down && agctl dev up` / рестарт сервера).
# Чего здесь нет: секретов. Ключи моделей и токены в профиль не пишутся —
#            в профиле только ИМЯ переменной, значение задаёт человек
#            (лаунчер → «Доступ») или администратор сервера (окружение).
#
# Формат комментариев к полям ниже одинаковый:
#   Что:        назначение поля
#   Где видно:  где пользователь увидит результат
#   Умолчание:  что будет, если поле не задать
# ─────────────────────────────────────────────────────────────────────────────

# Что:        версия схемы файла. Сейчас всегда 1.
# Умолчание:  нет — поле обязательно.
schema: 1

# Что:        идентификатор профиля: строчная латиница, цифры, дефис.
# Где видно:  имя каталога профиля (~/.agctl/profiles/<id>), имя дома
#             разработчика (~/.agctl/homes/<id>), суффикс образа
#             (agctl-dsh-<id>:<тег>), флаг --profile <id>.
# Умолчание:  нет — поле обязательно.
id: example

# Что:        базовый профиль, от которого этот наследует всё, что не задано
#             здесь: id соседнего каталога (или каталога рядом с родительским —
#             для варианта внутри репозитория базового: <профили>/org/dev с
#             extends: org) либо путь от этого профиля (".."). Словари
#             сливаются, списки и значения заменяются; файлы (assets/,
#             catalog/, image/, local/) ищутся сначала здесь, потом в базовом.
#             Так варианты одной организации (контуры, стенды, машины) держат
#             только свои отличия: другой шлюз моделей, адреса Jira.
# Где видно:  agctl dev init --profile <id варианта>; agctl dev paths.
# Умолчание:  без наследования.
# extends: example

# ── Бренд ────────────────────────────────────────────────────────────────────
# Вся кастомизация внешнего вида: логотип и две фразы.
brand:
  # Что:        название продукта в организации.
  # Где видно:  над левой панелью чата, в шапке веб-приложения, на странице входа.
  # Умолчание:  нет — поле обязательно.
  name: Example Workspaces

  # Что:        приветственная фраза.
  # Где видно:  крупно в центре экрана при открытии нового чата.
  # Умолчание:  штатная фраза харнесса.
  tagline: Рабочее место с ИИ-агентом

  # Что:        заголовок вкладки браузера.
  # Умолчание:  значение brand.name.
  title: Example Workspaces

  # Что:        буква-заглушка вместо логотипа.
  # Где видно:  там же, где логотип, если brand.logo не задан.
  # Умолчание:  первая буква brand.name.
  letter: E

  # Что:        путь к логотипу внутри профиля. Только PNG, квадрат от 128×128.
  # Где видно:  левая панель чата, шапка веб-приложения, страница входа.
  # Умолчание:  без логотипа — показывается brand.letter.
  logo: assets/logo.png

# ── Страница входа ───────────────────────────────────────────────────────────
login:
  # Что:        подзаголовок формы входа (серверный режим).
  # Умолчание:  без подзаголовка.
  subtitle: вход в личное рабочее место

# ── Установка ────────────────────────────────────────────────────────────────
install:
  # Что:        репозиторий GitHub с комплектами agctl вашей организации
  #             (бинарь + этот профиль одним архивом).
  # Где видно:  страница «Скачать» веб-приложения — в команде установки.
  # Умолчание:  пусто — на странице только установка нейтрального agctl.
  repo: example-org/agctl-profile-example

# ── Модели ───────────────────────────────────────────────────────────────────
# Какие модели организация даёт сотрудникам. Разработчик в локальном режиме
# может добавить поверх своих личных провайдеров (лаунчер → «Доступ»).
llm:
  # Что:        имя основного провайдера.
  # Где видно:  в списке моделей харнесса и в лаунчере («Доступ»).
  # Умолчание:  нет — задайте понятное имя (название шлюза или вендора).
  provider_name: example-gateway

  # Что:        адрес OpenAI-совместимого API основного провайдера.
  # Умолчание:  нет — без адреса рабочее место откроется без моделей.
  default_base_url: https://llm.example.com/v1

  # Что:        модель, выбранная по умолчанию в новом чате.
  default_model: example-fast

  # Что:        все модели основного провайдера через запятую.
  # Где видно:  выпадающий список моделей харнесса.
  default_models: example-fast,example-deep

  # Что:        ключ основного провайдера в профиль НЕ пишется. Имя переменной
  #             фиксировано: AGCTL_LLM_API_KEY. В локальном режиме значение
  #             вводится в лаунчере («Доступ»), на сервере — в окружении.

  # Что:        дополнительные провайдеры организации (второй шлюз, локальная
  #             модель). Список; у каждого — своё имя и своя переменная ключа.
  # Умолчание:  дополнительных провайдеров нет.
  extra_providers:
    # Что: имя провайдера в списке моделей.
    - name: example-onprem
      # Что: адрес OpenAI-совместимого API.
      base_url: https://onprem-llm.example.com/v1
      # Что: модель по умолчанию у этого провайдера.
      model: local-coder
      # Что: все модели провайдера через запятую.
      models: local-coder,local-chat
      # Что: ИМЯ переменной с ключом (значение — в «Доступе» или окружении).
      api_key_env: AGCTL_LLM_ONPREM_API_KEY

# ── Доступы по умолчанию ─────────────────────────────────────────────────────
# Что:        несекретные значения для рабочего места: адреса Jira, Confluence,
#             GitLab организации. Действуют, пока разработчик не задал своё
#             («Доступ» в лаунчере). Секреты (…_TOKEN, …_KEY, пароли) здесь
#             запрещены — загрузка профиля их отклонит.
# Где видно:  «Доступ» — с отметкой «из профиля»; env контейнера.
# Умолчание:  пусто.
env:
  JIRA_URL: https://jira.example.com

# Что:        где искать значения в переменных окружения машины разработчика:
#             имя в agctl → имена переменных по порядку. agctl dev up переносит
#             найденное только в ПУСТЫЕ доступы дома (токены — в хранилище ОС).
#             Свои синонимы agctl знает и так (JIRA_USERNAME → JIRA_USER,
#             CONFLUENCE_PERSONAL_TOKEN → CONFLUENCE_TOKEN и др.), ключи
#             extra_providers берутся под своими именами.
# Где видно:  agctl dev up печатает перенесённые имена; agctl dev secrets list.
# Умолчание:  только встроенные синонимы.
env_from:
  AGCTL_LLM_API_KEY: [EXAMPLE_LLM_TOKEN]

# ── Сеть ─────────────────────────────────────────────────────────────────────
egress:
  # Что:        хосты, куда рабочему месту разрешён выход, когда включён белый
  #             список исходящих соединений (egress_allowlist в настройках дома
  #             или флаг сервера). Адреса провайдеров моделей разрешаются сами.
  # Умолчание:  пусто — при включённом белом списке доступны только модели.
  allow:
    - gitlab.example.com
    - jira.example.com

# ── Справка и подписи ────────────────────────────────────────────────────────
help:
  # Что:        заголовок окна «Справка» в кабинете пользователя (сервер).
  cabinet_title: Справка — Example Workspaces
map:
  # Что:        подпись узла «модели» на карте системы (/map).
  llm_label: Example LLM gateway
examples:
  # Что:        пример адреса Jira в подсказках полей доступа.
  jira_url: https://jira.example.com

# ── Сценарии рабочего пространства ───────────────────────────────────────────
workspace:
  # Что:        готовые стартовые проекты: при создании воркспейса репозиторий
  #             клонируется как заготовка.
  # Где видно:  диалог «Новый воркспейс» в чате.
  # Умолчание:  сценариев нет — воркспейс создаётся пустым.
  scenarios:
    # Что: идентификатор сценария (уникален в профиле).
    - id: service-template
      # Что: название в диалоге.
      title: Шаблон сервиса
      # Что: пояснение под названием.
      description: Заготовка сервиса организации с CI и линтерами
      # Что: адрес репозитория-заготовки (доступ — токеном GitLab из «Доступа»).
      clone_url: https://gitlab.example.com/platform/service-template.git

# ── Образы рабочего места ────────────────────────────────────────────────────
images:
  # Что:        надстройка образа организации: Dockerfile внутри профиля,
  #             собирается поверх базового образа agctl-dsh (FROM ${BASE}).
  #             Сюда ставятся пакеты и инструменты, нужные всем сотрудникам.
  # Умолчание:  надстройки нет — используется базовый образ.
  dockerfile: image/Dockerfile

  # Что:        образы, которые разработчик может выбрать в лаунчере.
  #             Первый в списке — образ по умолчанию.
  # Умолчание:  базовые образы agctl.
  dev:
    - agctl-dsh-example:0.2.2
    - agctl-dsh:0.2.2

  # Что:        реестр, откуда скачиваются образы agctl с локальными именами
  #             (agctl-dsh:<тег>, agctl-dsh-web:<тег>, надстройка профиля):
  #             agctl тянет <реестр>/<имя>:<тег> и ставит образу локальное
  #             имя. Нет образа в реестре или реестр недоступен — недостающее
  #             собирается на машине разработчика (нижние ступени — сначала
  #             тоже из реестра). Адрес — без схемы и тега, строчными
  #             буквами; none — в реестр не ходить, образы только собираются.
  #             Образы с реестром в имени в списке dev
  #             (ghcr.io/org/agctl-dsh:0.2.2) тянутся как есть.
  # Где видно:  лаунчер → «Образы»: «Как собирается» (откуда скачивается) и
  #             «Скачать из реестра»; журнал запуска места; agctl dev update.
  # Умолчание:  ghcr.io/arijjia — туда воркфлоу images репозитория agctl
  #             публикует agctl-dsh и agctl-dsh-min (вкусов и надстроек
  #             профилей там нет — они собираются поверх).
  # registry: registry.example.com/agctl
