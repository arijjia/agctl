# ─────────────────────────────────────────────────────────────────────────────
# local/bridge-tools.yaml — мост к компьютеру разработчика (локальный режим).
#
# Что это:   белый список команд, которые агент из контейнера может выполнить
#            на машине разработчика. Всё, чего здесь нет, агенту недоступно.
# Кто читает: agctl при каждом старте локального режима. Разработчик может
#            добавить свои команды в настройках дома (config.yaml: bridge.tools).
# Как агент вызывает: MCP-сервер «Мост к хосту» в пресете или `agctl bridge call`.
# Безопасность: команда запускается без shell, аргументы подставляются в
#            шаблон {{имя}} и проверяются по pattern; confirm: true — вызов
#            ждёт подтверждения человека (`agctl dev bridge approve <id>`).
#            Каждый вызов пишется в журнал logs/bridge.log.
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - # Что: имя инструмента (латиница, цифры, подчёркивание).
    name: host_uname
    # Что: описание — его читает агент, когда решает, какой инструмент вызвать.
    description: Версия ОС и архитектура компьютера разработчика. Только чтение.
    # Что: команда и аргументы списком (не строкой — shell не участвует).
    command: ["uname", "-a"]
    # Что: предел времени выполнения в секундах.
    timeout_sec: 10

  - name: docker_ps
    description: Список контейнеров на компьютере разработчика с фильтром по имени. Только чтение.
    command: ["docker", "ps", "--filter", "name={{name}}"]
    # Что: аргументы шаблона: описание для агента, обязательность, проверка.
    args:
      name:
        description: часть имени контейнера
        required: true
        pattern: "^[a-zA-Z0-9_.-]{1,64}$"
    timeout_sec: 30

  - name: compose_restart
    description: Перезапустить сервис docker compose в каталоге проекта. Изменяет состояние — требует подтверждения.
    command: ["docker", "compose", "--project-directory={{dir}}", "restart", "{{service}}"]
    args:
      dir:
        description: каталог проекта с docker-compose.yml на компьютере разработчика
        required: true
      service:
        description: имя сервиса
        required: true
        pattern: "^[a-zA-Z0-9_-]{1,64}$"
    timeout_sec: 120
    # Что: true — перед выполнением нужно подтверждение человека.
    confirm: true
