stages: [lint]

bsl-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends default-jre-headless curl ca-certificates
  script:
    # Версия зафиксирована: "latest" отдавал не тот артефакт; запускаемый jar — *-exec.jar
    - curl -fsSL -o bsl-exec.jar
      https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.7/bsl-language-server-1.0.7-exec.jar
    # v1.0.7: подкоманда analyze; -s исходники, -r json, -o каталог отчёта (создаём заранее)
    - mkdir -p bsl-report
    - java -jar bsl-exec.jar analyze -s . -r json -o bsl-report -q || true
    - python ci/check_lint.py bsl-report
  artifacts:
    paths: [bsl-report/]
    when: always
