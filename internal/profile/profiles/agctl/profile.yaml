# Нейтральный профиль agctl: ядро без привязки к организации.
# Этот профиль встроен в бинарь по умолчанию (--profile agctl).
schema: 1
id: agctl
brand:
  name: agctl
  tagline: агентские рабочие места
  title: agctl
  letter: a
login:
  subtitle: вход в личное рабочее место
# Провайдер чата по умолчанию — публичный OpenAI-совместимый Z.AI GLM
# (Coding Plan); ключ только в env хоста (AGCTL_LLM_API_KEY в .env), в
# профиле его нет. Без этих дефолтов рабочее место открывалось голым
# онбордингом dsh («Add an API key… DeepSeek provider») без моделей.
# Корпоративные шлюзы (LiteLLM и пр.) — в профилях организаций.
llm:
  provider_name: zai-coding-cn
  default_base_url: https://api.z.ai/api/coding/paas/v4
  default_model: glm-5.3-flash
  default_models: glm-5.3,glm-5.3-flash,glm-4.5-flash,glm-4.5v
help:
  cabinet_title: Справка — agctl
map:
  llm_label: LLM gateway
examples:
  jira_url: https://jira.example.com
# Образы рабочего места: базовый agctl-dsh без надстройки организации;
# лаунчер developer'а выбирает между вариантами «с SSH» и «без SSH».
images:
  dev:
    - agctl-dsh:0.2.2
    - agctl-dsh-web:0.2.2
    - agctl-dsh-nossh:0.2.2
